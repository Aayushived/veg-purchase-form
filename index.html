<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vegetable vendor entry</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--green:#167951;--border:#d8e2da;--background:#f5f9f6;--text:#193128}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:680px;margin:auto;padding:18px 14px 34px}h1{font-size:23px;margin:0 0 4px}p{margin:5px 0 14px;color:#52655a;font-size:14px}
.panel{background:white;border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:12px}
input{width:100%;border:1px solid #becdc2;border-radius:10px;padding:11px;font:inherit;background:white;min-height:47px}
input:focus{outline:2px solid #5ba37f}label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:280px;overflow:auto;margin-top:11px}
.choice{padding:10px 8px;background:#fff;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:14px;text-align:left}
.choice.selected{background:#e2f4e9;color:#0b6842;border-color:#23865a;font-weight:700}
.item{border-bottom:1px solid #e1e8e2;padding:12px 0}.item:last-child{border:0}.itemhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.remove{background:none;border:0;color:#a33636;font-size:20px;padding:4px 8px}
.save{background:var(--green);width:100%;border:0;color:white;font:inherit;font-weight:700;border-radius:10px;padding:15px;min-height:52px}.save:disabled{opacity:.45}
.summary{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0;font-weight:700}.summary strong{font-size:22px;color:var(--green)}
#status{color:#a33232;font-size:14px;margin-top:8px;min-height:22px}.hint{font-size:12px}
[hidden]{display:none!important}
</style></head>
<body><main>
<h1 id="heading">Vegetable entry</h1><p id="subtitle"></p>
<section id="overallPanel" class="panel" hidden><label id="overallLabel" for="overallInput">Total sales (₹)</label><input type="number" inputmode="decimal" min="0.01" step="0.01" id="overallInput" placeholder="3500"></section>
<section id="choosePanel" class="panel"><label id="chooseLabel" for="search">Select vegetables</label><input id="search" type="search" placeholder="Search vegetables…"><div class="choices" id="choices"></div></section>
<section id="detailsPanel" class="panel"><strong id="detailsLabel">Enter amounts</strong><div id="details"></div></section>
<section class="panel"><div class="summary"><span id="totalLabel">Total</span><strong id="total">₹0</strong></div>
<button class="save" id="save" disabled>Save All</button><div id="status" role="status" aria-live="polite"></div>
<p class="hint" id="hint">Use the Telegram bot button to submit. The bot saves the data into Google Sheets.</p></section>
</main><script>
(()=>{'use strict';
 const tg=window.Telegram?.WebApp;
 const qs=new URLSearchParams(location.search);
 const mode=['inventory','sale_overall','sale_vegetable'].includes(qs.get('mode'))?qs.get('mode'):'inventory';
 const lang=['en','mr','hi','gu'].includes(qs.get('lang'))?qs.get('lang'):'en';
 const vegs=[
 ['tomato','🍅 Tomato','टोमॅटो','टमाटर','ટામેટાં'],['potato','🥔 Potato','बटाटा','आलू','બટાકા'],
 ['onion','🧅 Onion','कांदा','प्याज','ડુંગળી'],['cabbage','🥬 Cabbage','कोबी','पत्ता गोभी','કોબી'],
 ['cauliflower','🥦 Cauliflower','फ्लॉवर','फूलगोभी','ફૂલકોબી'],['carrot','🥕 Carrot','गाजर','गाजर','ગાજર'],
 ['brinjal','🍆 Brinjal','वांगी','बैंगन','રીંગણ'],['chilli','🌶️ Chilli','मिरची','मिर्च','મરચાં'],
 ['cucumber','🥒 Cucumber','काकडी','खीरा','કાકડી'],['spinach','🥬 Spinach','पालक','पालक','પાલક'],
 ['okra','🌱 Okra','भेंडी','भिंडी','ભીંડા'],['peas','🫛 Peas','वाटाणा','मटर','વટાણા'],
 ['capsicum','🫑 Capsicum','ढोबळी मिरची','शिमला मिर्च','શિમલા મરચાં'],['pumpkin','🎃 Pumpkin','भोपळा','कद्दू','કોળું'],
 ['radish','🌱 Radish','मुळा','मूली','મૂળા'],['beans','🫘 Beans','फरसबी','फली','ફણસી'],
 ['bittergourd','🥒 Bitter gourd','कारले','करेला','કારેલા'],['bottlegourd','🥒 Bottle gourd','दुधी भोपळा','लौकी','દૂધી'],
 ['garlic','🧄 Garlic','लसूण','लहसुन','લસણ'],['ginger','🫚 Ginger','आले','अदरक','આદુ']
 ];
 const T={
 en:{inventory:['📦 Add inventory','Select vegetables; enter quantity added in kg. You can add inventory multiple times today.','Quantity added (kg)','Save inventory'],sale_vegetable:['🥬 Vegetable-wise sales','Choose vegetables and enter total sales amount (₹) for each. No quantity required.','Sales amount (₹)','Save vegetable sales'],sale_overall:['💵 Overall sales','Enter the total sales amount in rupees.','Total sales (₹)','Save overall sales'],choose:'Select vegetables',details:'Enter details',search:'Search vegetables…',total:'Total amount',hint:'Open using your Telegram bot. Changes are saved only after tapping Save.',invalid:'Please enter a positive number for every selected item.',select:'Please select at least one vegetable.',notTelegram:'Open this form using the button inside your Telegram bot.',busy:'Sending to Telegram…',large:'Too much data; send fewer vegetables.'},
 mr:{inventory:['📦 साठा भरा','भाज्या निवडा व जमा झालेला साठा किलोमध्ये लिहा. दिवसातून अनेकदा नोंद करू शकता.','जमा किलो','साठा जतन करा'],sale_vegetable:['🥬 भाजीप्रमाणे विक्री','प्रत्येक भाजीसाठी विक्रीची एकूण रक्कम लिहा. किलो नको.','विक्री रक्कम (₹)','विक्री जतन करा'],sale_overall:['💵 एकूण विक्री','एकूण विक्रीची रक्कम लिहा.','विक्री रक्कम (₹)','एकूण विक्री जतन करा'],choose:'भाज्या निवडा',details:'माहिती भरा',search:'भाजी शोधा…',total:'एकूण रक्कम',hint:'Telegram बॉटमधून उघडा. जतन बटण दाबल्यावर नोंद होते.',invalid:'योग्य सकारात्मक संख्या लिहा.',select:'किमान एक भाजी निवडा.',notTelegram:'Telegram बॉटच्या बटणातून फॉर्म उघडा.',busy:'Telegram ला पाठवत आहे…',large:'खूप भाज्या आहेत; दोनदा पाठवा.'},
 hi:{inventory:['📦 स्टॉक जोड़ें','सब्जियाँ चुनें और केवल जोड़ा गया स्टॉक किलो में लिखें. दिन में कई बार जोड़ सकते हैं.','जोड़ा गया स्टॉक (kg)','स्टॉक सेव करें'],sale_vegetable:['🥬 सब्जीवार बिक्री','हर सब्जी के लिए कुल बिक्री राशि लिखें. मात्रा की जरूरत नहीं.','बिक्री राशि (₹)','बिक्री सेव करें'],sale_overall:['💵 कुल बिक्री','कुल बिक्री राशि रुपये में भरें.','कुल बिक्री (₹)','कुल बिक्री सेव करें'],choose:'सब्जियाँ चुनें',details:'रकम दर्ज करें',search:'सब्जी खोजें…',total:'कुल राशि',hint:'यह फॉर्म Telegram बॉट के बटन से खोलें.',invalid:'हर चुनी सब्जी के लिए सही राशि भरें.',select:'कम से कम एक सब्जी चुनें.',notTelegram:'Telegram बॉट से यह फॉर्म खोलें.',busy:'Telegram को भेज रहे हैं…',large:'बहुत सारी सब्जियाँ हैं; अलग-अलग भेजें.'},
 gu:{inventory:['📦 સ્ટોક ઉમેરો','શાક પસંદ કરો અને ઉમેરેલો જથ્થો કિલોમાં ભરો. દિવસમાં ઘણી વખત ઉમેરી શકો છો.','જથ્થો (kg)','સ્ટોક સાચવો'],sale_vegetable:['🥬 શાક પ્રમાણે વેચાણ','દરેક શાકની કુલ વેચાણ રકમ ભરો; જથ્થો જરૂરી નથી.','વેચાણ રકમ (₹)','વેચાણ સાચવો'],sale_overall:['💵 કુલ વેચાણ','કુલ વેચાણની રકમ ભરો.','કુલ વેચાણ (₹)','કુલ વેચાણ સાચવો'],choose:'શાક પસંદ કરો',details:'વિગતો ભરો',search:'શાક શોધો…',total:'કુલ રકમ',hint:'Telegram બોટના બટનથી ફોર્મ ખોલો.',invalid:'દરેક પસંદ કરેલ શાક માટે યોગ્ય આંકડો ભરો.',select:'ઓછામાં ઓછું એક શાક પસંદ કરો.',notTelegram:'Telegram બોટમાંથી ફોર્મ ખોલો.',busy:'Telegram માં મોકલી રહ્યા છીએ…',large:'ઘણી બધી વસ્તુઓ છે; અલગ મોકલો.'}
 }[lang];
 const $=x=>document.getElementById(x), choices=new Map(), idx={en:1,mr:2,hi:3,gu:4}[lang];
 document.documentElement.lang=lang;
 $('heading').textContent=T[mode][0];$('subtitle').textContent=T[mode][1];$('chooseLabel').textContent=T.choose;
 $('detailsLabel').textContent=T.details;$('search').placeholder=T.search;
 $('totalLabel').textContent=mode==='inventory'?'Items selected':T.total;$('save').textContent=T[mode][3];$('hint').textContent=T.hint;
 $('choosePanel').hidden=mode==='sale_overall';$('detailsPanel').hidden=mode==='sale_overall';$('overallPanel').hidden=mode!=='sale_overall';$('overallLabel').textContent=T[mode][2];
 const label=v=>v[idx];
 const positive=s=>String(s).trim()!==''&&Number.isFinite(Number(s))&&Number(s)>0&&Number(s)<=1e7&&Math.abs(Number(s)*100-Math.round(Number(s)*100))<1e-6;
 function renderChoices(){
   $('choices').replaceChildren();const term=$('search').value.trim().toLowerCase();
   for(const v of vegs.filter(x=>x.slice(1).some(s=>s.toLowerCase().includes(term)))){
     const b=document.createElement('button');b.type='button';b.className='choice'+(choices.has(v[0])?' selected':'');
     b.textContent=(choices.has(v[0])?'✓ ':'+ ')+label(v);
     b.onclick=()=>{if(choices.has(v[0]))choices.delete(v[0]);else choices.set(v[0],'');render();};
     $('choices').append(b);
   }
 }
 function renderDetails(){
   $('details').replaceChildren();
   for(const [key,value]of choices){
     const v=vegs.find(x=>x[0]===key),block=document.createElement('div');block.className='item';
     const top=document.createElement('div');top.className='itemhead';const title=document.createElement('strong');title.textContent=label(v);
     const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';
     remove.onclick=()=>{choices.delete(key);render();};top.append(title,remove);
     const labelEl=document.createElement('label');labelEl.textContent=T[mode][2];
     const input=document.createElement('input');input.type='number';input.inputMode='decimal';input.min='0.01';input.step='0.01';input.placeholder='0';input.value=value;
     input.oninput=()=>{choices.set(key,input.value);update();};labelEl.append(input);block.append(top,labelEl);$('details').append(block);
   }
 }
 function update(){
   const valid=mode==='sale_overall'?positive($('overallInput').value):choices.size>0&&[...choices.values()].every(positive);
   $('save').disabled=!valid;
   if(mode==='inventory')$('total').textContent=String(choices.size);
   else{
     const amount=mode==='sale_overall'?Number($('overallInput').value)||0:[...choices.values()].reduce((x,v)=>x+(Number(v)||0),0);
     $('total').textContent='₹'+amount.toLocaleString('en-IN',{maximumFractionDigits:2});
   }
 }
 function render(){renderChoices();renderDetails();update();}
 $('overallInput').oninput=update;$('search').oninput=renderChoices;
 $('save').onclick=()=>{
   $('status').textContent='';
   const values=mode==='sale_overall'?[{k:'overall',v:Number($('overallInput').value)}]:[...choices.entries()].map(([k,v])=>({k,v:Number(v)}));
   if(!values.length){$('status').textContent=T.select;return;}
   if(values.some(i=>!positive(i.v))){$('status').textContent=T.invalid;return;}
   if(!tg||typeof tg.sendData!=='function'||!tg.platform||tg.platform==='unknown'){$('status').textContent=T.notTelegram;return;}
   if(!window.crypto?.getRandomValues){$('status').textContent='Secure random generator unavailable.';return;}
   const bytes=new Uint8Array(16);window.crypto.getRandomValues(bytes);
   const nonce=[...bytes].map(x=>x.toString(16).padStart(2,'0')).join('');
   const packet=JSON.stringify({kind:'vendor_entry_v2',mode,batch:nonce,items:values});
   if(new TextEncoder().encode(packet).length>4096){$('status').textContent=T.large;return;}
   $('save').disabled=true;$('status').textContent=T.busy;
   try{tg.sendData(packet)}catch(e){$('save').disabled=false;$('status').textContent=String(e.message||e)}
 };
 if(tg){tg.ready();tg.expand()}
 render();
})();
</script></body></html>
