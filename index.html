<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vegetable Vendor Forms</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--green:#16804c;--bg:#f4f8f4;--border:#d7e2d9;--text:#193427}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:680px;margin:auto;padding:16px 13px 36px}h1{font-size:24px;margin:0 0 5px}p{font-size:14px;color:#516459;margin:0 0 12px}
.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;font-size:14px;font-weight:650;margin:5px 0}input,select{border:1px solid #b9cdbf;border-radius:9px;font:inherit;width:100%;padding:11px;background:#fff;min-height:44px}
input:focus,select:focus{outline:2px solid #70b58c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.veg{background:white;border:1px solid var(--border);border-radius:10px;padding:11px 8px;text-align:left;font:inherit;font-size:14px}
.veg.selected{background:#dcf2e3;border-color:var(--green);color:#075c37;font-weight:700}
.item{padding:13px 0;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:none}
.itemhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fields.single{grid-template-columns:1fr}
.muted{color:#607368;font-size:13px}.totals{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}.totals strong{font-size:22px;color:var(--green)}
button{cursor:pointer}.action{border:none;background:var(--green);color:#fff;padding:14px;font:inherit;font-weight:700;border-radius:10px;min-height:48px;width:100%}.action:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid var(--border);background:#fff;padding:10px 12px;font:inherit;border-radius:9px}.remove{border:0;background:transparent;color:#b03939;font-size:23px}
#status{font-size:14px;min-height:24px;color:#a52929;margin-top:8px}[hidden]{display:none!important}
</style></head>
<body><main>
<h1 id="title">Vendor form</h1><p id="intro"></p>
<section id="overall" class="panel" hidden><label id="overallLabel" for="overallValue">Total sales ₹</label><input id="overallValue" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="e.g. 3500"></section>
<section id="vegetableArea" hidden>
 <div class="panel" id="inventorySelectPanel"><label id="selectLabel">Select vegetables</label><input id="search" type="search" placeholder="Search vegetables"><div class="grid" id="choices" style="margin-top:10px"></div></div>
 <div class="panel" id="costArea" hidden><strong id="costLabel">How will you enter purchase cost?</strong>
  <label><input type="radio" name="costMode" value="overall" checked style="width:auto;min-height:auto"> <span id="costOverallLabel">One amount for the whole batch</span></label>
  <label><input type="radio" name="costMode" value="vegetable" style="width:auto;min-height:auto"> <span id="costEachLabel">Amount for each vegetable</span></label>
  <label><input type="radio" name="costMode" value="cost_only" style="width:auto;min-height:auto"> <span id="costOnlyLabel">Purchase cost only (no vegetables or quantities)</span></label>
  <div id="totalCostBox"><label id="totalCostLabel" for="totalCost">Total inventory purchase amount ₹</label><input id="totalCost" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="e.g. 2500"></div>
 </div>
 <div class="panel" id="itemsPanel"><strong id="detailsLabel">Details</strong><div id="items"></div></div>
</section>
<section id="expenses" class="panel" hidden><strong id="expenseHeading">Add expenses</strong><div id="expenseRows"></div><button type="button" class="secondary" id="addExpense">+ Add another expense</button></section>
<section class="panel"><div class="totals"><span id="totalLabel">Total</span><strong id="totalValue">₹0.00</strong></div>
<button id="save" class="action" disabled style="margin-top:15px">Save All</button><div id="status" role="status" aria-live="polite"></div><p id="hint" class="muted">Open from the Telegram bot to save.</p></section>
</main>
<script>
(()=>{'use strict';
const qs=new URLSearchParams(location.search);
const mode=['inventory','sale_overall','sale_vegetable','expense'].includes(qs.get('mode'))?qs.get('mode'):'inventory';
const lang=['en','mr','hi','gu'].includes(qs.get('lang'))?qs.get('lang'):'en';
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const VEG=[
['tomato','🍅 Tomato','टोमॅटो','टमाटर','ટામેટાં'],['potato','🥔 Potato','बटाटा','आलू','બટાકા'],
['onion','🧅 Onion','कांदा','प्याज','ડુંગળી'],['cabbage','🥬 Cabbage','कोबी','पत्ता गोभी','કોબી'],
['cauliflower','🥦 Cauliflower','फ्लॉवर','फूलगोभी','ફૂલકોબી'],['carrot','🥕 Carrot','गाजर','गाजर','ગાજર'],
['brinjal','🍆 Brinjal','वांगी','बैंगन','રીંગણ'],['chilli','🌶️ Chilli','मिरची','मिर्च','મરચાં'],
['cucumber','🥒 Cucumber','काकडी','खीरा','કાકડી'],['spinach','🥬 Spinach','पालक','पालक','પાલક'],
['okra','🌱 Okra','भेंडी','भिंडी','ભીંડા'],['peas','🫛 Peas','वाटाणा','मटर','વટાણા'],
['capsicum','🫑 Capsicum','ढोबळी मिरची','शिमला मिर्च','શિમલા મરચાં'],['pumpkin','🎃 Pumpkin','भोपळा','कद्दू','કોળું'],
['radish','🌱 Radish','मुळा','मूली','મૂળા'],['beans','🫘 Beans','फरसबी','फली','ફણસી'],
['bittergourd','🥒 Bitter gourd','कारले','करेला','કારેલા'],['bottlegourd','🥒 Bottle gourd','दुधी भोपळा','लौकी','દૂધી'],
['garlic','🧄 Garlic','लसूण','लहसुन','લસણ'],['ginger','🫚 Ginger','आले','अदरक','આદુ']
];
const COSTS=['Transport','Labour','Rent','Electricity','Packaging','Market fees','Other'];
const L={
 en:{inventory:['📦 Add inventory','Select vegetables, add kg and enter purchase cost. You can add inventory several times a day.','Quantity (kg)','Save inventory'],sale_overall:['💰 Overall daily sales','Enter the total sales amount in ₹.','Sales amount (₹)','Save sales'],sale_vegetable:['🥬 Vegetable-wise sales','Select vegetables and enter the total sales amount for each. No quantity required.','Sales amount (₹)','Save sales'],expense:['💸 Add expenses','Enter one or more expenses on this screen.','Expense amount (₹)','Save expenses'],select:'Select vegetables',search:'Search vegetables...',cost:'How will you enter purchase cost?',overallCost:'One total amount for the batch',eachCost:'Separate amount for each vegetable',costOnly:'Purchase cost only (no vegetables or quantities)',totalCost:'Total inventory purchase cost (₹)',details:'Enter details',expHeading:'Expenses',expCategory:'Category',expOther:'Describe other expense',addExpense:'+ Add another expense',total:'Total',count:'Vegetables selected',invalid:'Check that each field is filled with a positive number.',notTelegram:'Open using your Telegram bot button to save.',tooLarge:'Too many entries; please divide into smaller batches.',saving:'Submitting to Telegram...',hint:'Only tapping Save inside Telegram submits data.'},
 mr:{inventory:['📦 साठा भरा','भाज्या निवडा, किलो व खरेदी खर्च भरा. दिवसभरात अनेकदा साठा भरता येतो.','किलो','साठा जतन करा'],sale_overall:['💰 एकूण विक्री','एकूण विक्री रक्कम भरा.','विक्री ₹','विक्री जतन करा'],sale_vegetable:['🥬 भाजीवार विक्री','भाज्या निवडा आणि त्यांची एकूण विक्री रक्कम भरा. किलो नको.','विक्री ₹','विक्री जतन करा'],expense:['💸 खर्च भरा','एकाच फॉर्ममध्ये अनेक खर्च भरा.','रक्कम ₹','खर्च जतन करा'],select:'भाज्या निवडा',search:'भाजी शोधा...',cost:'खरेदी खर्च कसा भराल?',overallCost:'संपूर्ण खरेदीची एक रक्कम',eachCost:'प्रत्येक भाजीचा वेगळा खर्च',costOnly:'फक्त खरेदी खर्च (भाज्या किंवा किलो नको)',totalCost:'एकूण खरेदी खर्च ₹',details:'तपशील भरा',expHeading:'खर्च',expCategory:'प्रकार',expOther:'इतर खर्चाचा तपशील',addExpense:'+ आणखी खर्च',total:'एकूण',count:'निवडलेल्या भाज्या',invalid:'सर्व रकमा योग्य आणि शून्यापेक्षा मोठ्या भरा.',notTelegram:'जतन करण्यासाठी Telegram बॉटमधून उघडा.',tooLarge:'खूप नोंदी आहेत. कमी नोंदी पाठवा.',saving:'Telegram ला पाठवत आहे...',hint:'Telegram मध्ये Save दाबल्यावर नोंद जतन होते.'},
 hi:{inventory:['📦 स्टॉक जोड़ें','सब्जियाँ चुनें, किलो और खरीद लागत भरें. दिन में कई बार जोड़ सकते हैं.','मात्रा (kg)','स्टॉक सेव करें'],sale_overall:['💰 कुल बिक्री','कुल बिक्री राशि भरें.','बिक्री ₹','बिक्री सेव करें'],sale_vegetable:['🥬 सब्जीवार बिक्री','सब्जियाँ चुनें और हर सब्जी की कुल बिक्री राशि भरें. किलो नहीं चाहिए.','बिक्री ₹','बिक्री सेव करें'],expense:['💸 खर्च जोड़ें','एक फॉर्म में कई खर्च भरें.','राशि ₹','खर्च सेव करें'],select:'सब्जियाँ चुनें',search:'सब्जी खोजें...',cost:'खरीद लागत कैसे भरें?',overallCost:'सभी सब्जियों की एक कुल राशि',eachCost:'हर सब्जी की अलग लागत',costOnly:'सिर्फ खरीद लागत (सब्ज़ी या किलो नहीं)',totalCost:'कुल खरीद राशि ₹',details:'विवरण',expHeading:'खर्च',expCategory:'श्रेणी',expOther:'अन्य खर्च का विवरण',addExpense:'+ एक और खर्च',total:'कुल',count:'चुनी सब्जियाँ',invalid:'हर ज़रूरी फ़ील्ड में सही सकारात्मक संख्या भरें.',notTelegram:'सेव करने के लिए Telegram बॉट से खोलें.',tooLarge:'बहुत सारी एंट्री हैं. छोटे समूह बनाएं.',saving:'Telegram को भेज रहे हैं...',hint:'Telegram में Save दबाने पर ही डेटा सेव होगा.'},
 gu:{inventory:['📦 સ્ટોક ઉમેરો','શાક પસંદ કરો, કિલો અને ખરીદી ખર્ચ ભરો. દિવસમાં ઘણી વાર ઉમેરી શકો છો.','જથ્થો (kg)','સ્ટોક સાચવો'],sale_overall:['💰 કુલ વેચાણ','કુલ વેચાણ રકમ ભરો.','વેચાણ ₹','વેચાણ સાચવો'],sale_vegetable:['🥬 શાક પ્રમાણે વેચાણ','શાક પસંદ કરો અને દરેકની કુલ વેચાણ રકમ ભરો. કિલો જરૂરી નથી.','વેચાણ ₹','વેચાણ સાચવો'],expense:['💸 ખર્ચ ઉમેરો','એક ફોર્મમાં અનેક ખર્ચ ભરો.','રકમ ₹','ખર્ચ સાચવો'],select:'શાક પસંદ કરો',search:'શાક શોધો...',cost:'ખરીદી ખર્ચ કેવી રીતે ભરશો?',overallCost:'આખી ખરીદીની એક રકમ',eachCost:'દરેક શાકનો અલગ ખર્ચ',costOnly:'માત્ર ખરીદી ખર્ચ (શાક કે કિલો નહીં)',totalCost:'કુલ ખરીદી ખર્ચ ₹',details:'વિગતો ભરો',expHeading:'ખર્ચ',expCategory:'પ્રકાર',expOther:'અન્ય ખર્ચની વિગત',addExpense:'+ બીજો ખર્ચ',total:'કુલ',count:'પસંદ શાક',invalid:'દરેક જરૂરી જગ્યાએ યોગ્ય રકમ ભરો.',notTelegram:'સાચવવા Telegram બોટમાંથી ખોલો.',tooLarge:'ઘણી નોંધ છે. નાના જૂથમાં મોકલો.',saving:'Telegram માં મોકલે છે...',hint:'Telegram માં Save દબાવવાથી જ નોંધ સાચવાય છે.'}
}[lang];
const $=id=>document.getElementById(id),selected=new Map();let expenseRows=[{id:1,k:'Transport',v:'',note:''}],counter=2;
const index={en:1,mr:2,hi:3,gu:4}[lang],label=v=>v[index];
const positive=n=>String(n).trim()!==''&&Number.isFinite(Number(n))&&Number(n)>0&&Number(n)<=10000000&&Math.abs(Number(n)*100-Math.round(Number(n)*100))<1e-6;
const val=n=>Number(n)||0;
const costMode=()=>document.querySelector('input[name="costMode"]:checked').value;
const input=(placeholder,value,fn)=>{const el=document.createElement('input');el.type='number';el.inputMode='decimal';el.min='0.01';el.step='0.01';el.placeholder=placeholder;el.value=value;el.addEventListener('input',()=>fn(el.value));return el};
const wrap=(name,control)=>{const d=document.createElement('div'),l=document.createElement('label');l.textContent=name;d.append(l,control);return d};
function renderChoices(){
 const q=$('search').value.trim().toLowerCase();$('choices').replaceChildren();
 VEG.filter(v=>v.slice(1).some(x=>x.toLowerCase().includes(q))).forEach(v=>{
  const btn=document.createElement('button');btn.type='button';btn.className='veg'+(selected.has(v[0])?' selected':'');btn.textContent=(selected.has(v[0])?'✓ ':'▫ ')+label(v);
  btn.onclick=()=>{if(selected.has(v[0]))selected.delete(v[0]);else selected.set(v[0],{q:'',c:'',v:''});renderChoices();renderItems();update()};$('choices').append(btn);
 });
}
function renderItems(){
 $('items').replaceChildren();for(const [key,values] of selected){
  const veg=VEG.find(v=>v[0]===key),block=document.createElement('div');block.className='item';
  const head=document.createElement('div');head.className='itemhead';head.textContent=label(veg);block.append(head);
  const fields=document.createElement('div');fields.className='fields';
  if(mode==='inventory'){
   fields.append(wrap(L[mode][2],input('kg',values.q,x=>{values.q=x;update()})));
   if(costMode()==='vegetable')fields.append(wrap(L.totalCost,input('₹',values.c,x=>{values.c=x;update()})));
  }else fields.append(wrap(L[mode][2],input('₹',values.v,x=>{values.v=x;update()})));
  if(mode==='sale_vegetable')fields.classList.add('single');block.append(fields);$('items').append(block);
 }
}
function renderExpenses(){
 $('expenseRows').replaceChildren();expenseRows.forEach((row,j)=>{
  const box=document.createElement('div');box.className='item';const head=document.createElement('div');head.className='itemhead';head.textContent='Expense '+(j+1);
  const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','Remove expense');remove.onclick=()=>{expenseRows=expenseRows.filter(x=>x.id!==row.id);renderExpenses();update()};head.append(remove);box.append(head);
  const fields=document.createElement('div');fields.className='fields';const sel=document.createElement('select');
  COSTS.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;sel.append(o)});sel.value=row.k;sel.onchange=()=>{row.k=sel.value;renderExpenses();update()};
  fields.append(wrap(L.expCategory,sel));fields.append(wrap(L.expense[2],input('₹',row.v,x=>{row.v=x;update()})));box.append(fields);
  if(row.k==='Other'){const other=document.createElement('input');other.type='text';other.maxLength=60;other.value=row.note;other.placeholder=L.expOther;other.oninput=()=>{row.note=other.value;update()};box.append(wrap(L.expOther,other));}
  $('expenseRows').append(box);
 });
}
function valid(){
 if(mode==='sale_overall')return positive($('overallValue').value);
 if(mode==='expense')return expenseRows.length>0&&expenseRows.length<=20&&expenseRows.every(r=>positive(r.v)&&(r.k!=='Other'||r.note.trim().length>0));
 if(mode==='inventory'&&costMode()==='cost_only')return positive($('totalCost').value);
 if(!selected.size)return false;
 if(mode==='inventory')return [...selected.values()].every(v=>positive(v.q)&&(costMode()!=='vegetable'||positive(v.c)))&&(costMode()!=='overall'||positive($('totalCost').value));
 return [...selected.values()].every(v=>positive(v.v));
}
function update(){
 const ok=valid();$('save').disabled=!ok;
 let total=0;
 if(mode==='inventory')total=['overall','cost_only'].includes(costMode())?val($('totalCost').value):[...selected.values()].reduce((s,v)=>s+val(v.c),0);
 else if(mode==='sale_overall')total=val($('overallValue').value);
 else if(mode==='expense')total=expenseRows.reduce((s,x)=>s+val(x.v),0);
 else total=[...selected.values()].reduce((s,v)=>s+val(v.v),0);
 $('totalValue').textContent='₹'+total.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function makePayload(){
 const batch='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,14);
 const packet={kind:'vendor_entry_v3',mode,batch,items:[]};
 if(mode==='sale_overall')packet.items=[{k:'overall',v:val($('overallValue').value)}];
 else if(mode==='expense')packet.items=expenseRows.map(r=>({k:r.k,v:val(r.v),...(r.k==='Other'?{note:r.note.trim()}:{})}));
 else if(mode==='sale_vegetable')packet.items=[...selected.entries()].map(([k,x])=>({k,v:val(x.v)}));
 else{
  packet.costMode=costMode();
  packet.items=costMode()==='cost_only'?[]:[...selected.entries()].map(([k,x])=>({k,q:val(x.q),...(costMode()==='vegetable'?{c:val(x.c)}:{})}));
  if(['overall','cost_only'].includes(costMode()))packet.totalCost=val($('totalCost').value);
 }
 return packet;
}
$('title').textContent=L[mode][0];$('intro').textContent=L[mode][1];$('overallLabel').textContent=L[mode][2];$('selectLabel').textContent=L.select;$('search').placeholder=L.search;
$('costLabel').textContent=L.cost;$('costOverallLabel').textContent=L.overallCost;$('costEachLabel').textContent=L.eachCost;$('costOnlyLabel').textContent=L.costOnly;$('totalCostLabel').textContent=L.totalCost;
$('detailsLabel').textContent=L.details;$('expenseHeading').textContent=L.expHeading;$('addExpense').textContent=L.addExpense;$('totalLabel').textContent=L.total;$('save').textContent=L[mode][3];$('hint').textContent=L.hint;
$('overall').hidden=mode!=='sale_overall';$('vegetableArea').hidden=!['inventory','sale_vegetable'].includes(mode);$('expenses').hidden=mode!=='expense';$('costArea').hidden=mode!=='inventory';
function updateCostModeUI(){
 const only=mode==='inventory'&&costMode()==='cost_only';
 $('inventorySelectPanel').hidden=only;
 $('itemsPanel').hidden=only;
 $('totalCostBox').hidden=mode==='inventory'&&!['overall','cost_only'].includes(costMode());
 $('totalCostLabel').textContent=only?L.costOnly+' (₹)':L.totalCost;
 renderItems();update();
}
document.querySelectorAll('input[name="costMode"]').forEach(el=>el.onchange=updateCostModeUI);
$('totalCost').oninput=update;$('overallValue').oninput=update;$('search').oninput=renderChoices;
$('addExpense').onclick=()=>{if(expenseRows.length>=20)return;expenseRows.push({id:counter++,k:'Transport',v:'',note:''});renderExpenses();update()};
$('save').onclick=()=>{
 if(!valid()){$('status').textContent=L.invalid;return;}
